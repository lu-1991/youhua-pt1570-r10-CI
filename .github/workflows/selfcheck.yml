name: 仓库自检

# 不编译固件, 只验证仓库自身:
#   1) 打包/校验脚本能用合成镜像跑通(含反例)
#   2) 契约 JSON 与各脚本口径一致
#   3) 适配补丁仍能应用到 config/build.env 里锁定的上游提交

on:
  push:
    branches: [main]
    paths: ['tools/**', 'patches/**', 'uboot/**', 'config/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: 离线自检
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 合成镜像跑通打包与校验
        run: |
          python3 tools/selftest.py        # oem: 裸 LZMA 三件套
          python3 tools/selftest_fit.py    # fit: uImage.FIT + 5 个反例
      - name: 契约字段自洽
        run: |
          python3 - <<'PY'
          import json, pathlib
          c = json.loads(pathlib.Path('uboot/contract.json').read_text(encoding='utf-8'))
          limits = c['limits']
          volumes = {v['name']: v for v in c['ubi']['volumes']}
          assert limits['kernel_read_bytes'] == 0x600000, limits
          assert limits['dtb_write_bytes'] == 0x40000, limits
          assert volumes['ubi_k0']['bytes'] == volumes['ubi_k1']['bytes'] == limits['kernel_volume_bytes']
          assert volumes['ubi_r0']['bytes'] == volumes['ubi_r1']['bytes'] == limits['rootfs_volume_bytes']
          assert volumes['ubi_r0']['id'] == 3 and volumes['ubi_r1']['id'] == 6
          assert volumes['ubi_k0']['id'] == 2 and volumes['ubi_k1']['id'] == 5
          assert c['boot']['root_volume_id'] == volumes['ubi_r0']['id']
          assert c['boot']['root_device'] == '/dev/ubiblock0_%d' % volumes['ubi_r0']['id']
          assert 'root=%s' % c['boot']['root_device'] in c['boot']['bootargs_required']
          assert c['ubi']['leb_bytes'] * volumes['ubi_r0']['eraseblocks'] == limits['rootfs_volume_bytes']
          assert 'ubi_dpi' in volumes and 'ubi_fpga' not in volumes
          assert sorted(v['id'] for v in c['ubi']['volumes']) == list(range(len(c['ubi']['volumes'])))
          assert sum(v['eraseblocks'] for v in c['ubi']['volumes']) == c['ubi']['reserved_leb_total']
          assert c['ubi']['peb_count'] == c['partitions'][4]['bytes'] // c['ubi']['peb_bytes']
          print('原厂契约自洽检查通过')
          PY
      - name: FIT 契约字段自洽
        run: |
          python3 - <<'PY'
          import json, pathlib
          c = json.loads(pathlib.Path('uboot/contract-uboot2026.json').read_text(encoding='utf-8'))
          assert c['bootloader']['fit_volume'] == 'fit'
          assert c['bootloader']['root_device'] == '/dev/fit0'
          assert 'root=%s' % c['bootloader']['root_device'] in c['bootloader']['bootargs_required']
          assert 'rootwait' in c['bootloader']['bootargs_required']
          assert c['fit']['align_bytes'] == 4096
          assert c['fit']['images']['rootfs']['type'] == 'filesystem'
          assert c['fit']['images']['rootfs']['loadable'] is True
          # kernel 的 load/entry 必须有(否则 Can't get image load address!), 且必须 2MiB 对齐
          # (新内核 text_offset=0; 用 0x80000 会卡在 Starting kernel 无输出)
          assert int(c['fit']['kernel_load_addr'], 0) % (2*1024*1024) == 0
          assert int(c['fit']['kernel_entry_addr'], 0) % (2*1024*1024) == 0
          assert int(c['fit']['kernel_load_addr'], 0) == int(c['fit']['kernel_entry_addr'], 0)
          assert c['limits']['fit_bytes'] >= c['limits']['kernel_bytes'] + c['limits']['rootfs_bytes']
          # 卷 ID 不再被假设: FIT 路径靠 volname 定位
          assert 'volumes' in c['bootloader']['dts']['volume_lookup']
          print('FIT 契约自洽检查通过')
          PY
      - name: 编译配置自洽
        run: |
          python3 - <<'PY'
          import pathlib
          t = pathlib.Path('config/pt1570-r10.config').read_text(encoding='utf-8')
          on = {ln.strip() for ln in t.splitlines() if ln.strip() and not ln.startswith('#')}
          # ccache 在 OpenWrt 里是 `bool ... if DEVEL`, DEVEL 关掉时 CCACHE 会被
          # make defconfig 丢弃 —— 两个必须成对出现, 否则缓存层白配。
          assert 'CONFIG_DEVEL=y' in on, 'CCACHE 需要 DEVEL=y, 否则 defconfig 会丢掉'
          assert 'CONFIG_CCACHE=y' in on, '缓存层依赖 CCACHE=y'
          assert 'CONFIG_UIMAGE_FIT_BLK=y' in on, 'fit 目标需要 fitblk 内核驱动'
          assert 'CONFIG_PACKAGE_fitblk=y' in on, 'fit 目标需要 fitblk 用户态工具'
          print('编译配置自洽检查通过: ccache + fitblk 符号齐全')
          PY
      - name: 刷机命令与契约一致
        run: |
          python3 tools/make_bundle.py --help >/dev/null
          grep -q 'pfl_kernel1_sz=0x600000' uboot/env-pt1570-r10.txt
          grep -q '251648K@0x340000(ubi_device)' uboot/env-pt1570-r10.txt
          echo "环境转储与契约一致"

  patch:
    name: 补丁可应用
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 拉取锁定提交并试打补丁
        run: |
          set -a; . config/build.env; set +a
          git init upstream
          git -C upstream remote add origin "$PONWRT_REPO"
          git -C upstream fetch --depth 1 origin "$PONWRT_REF"
          git -C upstream checkout -q FETCH_HEAD
          shopt -s nullglob
          for patch in patches/oem/*.patch; do
            echo "== $patch"
            git -C upstream apply --check --verbose "$GITHUB_WORKSPACE/$patch"
            git -C upstream apply "$GITHUB_WORKSPACE/$patch"
          done
          sh -n upstream/port/overlay/target/linux/rtl9617c/base-files/lib/upgrade/platform.sh
          grep -q 'pt1570_oem_upgrade' upstream/port/overlay/target/linux/rtl9617c/base-files/lib/upgrade/platform.sh
          # 两个 boot 目标都必须带 XT26G02C (0b:12) flash 补丁, 否则真机无 MTD/UBI/无线
          for t in fit oem; do
            p=$(find patches/$t -name '*spinand-xtx-g02c.patch' | head -1)
            test -n "$p" || { echo "缺少 $t 目标的 XT26G02C flash 补丁"; exit 1; }
            grep -q 'XT26G02C' "$p"
            grep -q '0x12' "$p"
          done
          # 补丁应用后内核补丁文件必须就位
          test -f upstream/port/overlay/target/linux/rtl9617c/patches-6.18/232-spinand-xtx-g02c.patch
          echo "补丁应用与语法检查通过"
