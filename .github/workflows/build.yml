name: 云编译 PT1570-R10 固件

# 云端拉取 PonWRT-TYFZA1 源码 -> 打适配补丁 -> 编译 -> 打包 -> 按 U-Boot 契约校验
# 本地不保存源码和工具链, 产物只有刷机包。
# 默认 boot_target=fit: 产出 uImage.FIT, 给机器上现装的 U-Boot 2026.07 (rtk_boot + fit 卷);
# 需要回到原厂 U-Boot 2020.01 时选 oem。

on:
  workflow_dispatch:
    inputs:
      ponwrt_ref:
        description: PonWRT-TYFZA1 提交号或分支(留空使用 config/build.env 的固定提交)
        required: false
        default: ''
      variant:
        description: 机型拓扑
        type: choice
        options: [four_gbe, 2p5g]
        default: four_gbe
      boot_target:
        description: 目标 bootloader（fit=U-Boot 2026.07 / oem=原厂 2020.01）
        type: choice
        options: [fit, oem]
        default: fit
      version:
        description: 固件版本号(写到 manifest 和升级包元数据)
        required: false
        default: ''
      release_tag:
        description: 可选, 填了就发布 Release(例如 v0.8.5-pt1570)
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: pt1570-${{ github.ref }}
  cancel-in-progress: true

env:
  PONWRT_DIR: ponwrt
  OPENWRT_DIR: ponwrt/sources/openwrt

jobs:
  firmware:
    name: 编译与打包
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4

      - name: 读取编译参数
        run: |
          set -a; . config/build.env; set +a
          if [ -n "${{ inputs.ponwrt_ref }}" ]; then
            PONWRT_REF="${{ inputs.ponwrt_ref }}"
          fi
          if [ -n "${{ inputs.variant }}" ]; then
            DEFAULT_VARIANT="${{ inputs.variant }}"
          fi
          VERSION_INPUT="${{ inputs.version }}"
          if [ -z "$VERSION_INPUT" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              VERSION_INPUT="${GITHUB_REF_NAME#v}"
            else
              VERSION_INPUT="$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
            fi
          fi
          {
            echo "PONWRT_REPO=$PONWRT_REPO"
            echo "PONWRT_REF=$PONWRT_REF"
            echo "RUNTIME_RELEASE=$RUNTIME_RELEASE"
            echo "RUNTIME_ASSET=$RUNTIME_ASSET"
            echo "SIGNING_KEY_URL=$SIGNING_KEY_URL"
            echo "SIGNING_KEY_SHA256=$SIGNING_KEY_SHA256"
            echo "VARIANT=$DEFAULT_VARIANT"
            echo "FIRMWARE_VERSION=$VERSION_INPUT"
            echo "BOOT_TARGET=${{ inputs.boot_target || 'fit' }}"
          } >> "$GITHUB_ENV"
          echo "本次编译: 上游 $PONWRT_REF, 机型 $DEFAULT_VARIANT, 版本 $VERSION_INPUT, 目标 ${{ inputs.boot_target || 'fit' }}"

      # 缓存 key 绑定"源码提交 + 配置指纹": 任一变化都换 key, 绝不拿旧工具链/ccache 编新代码。
      # 源码两处: PonWRT 基线(PONWRT_REF) + 它锁定的 OpenWrt pin(sources.lock.json)。
      # 配置指纹: 我们自己的 config 片段 + 补丁, 一改就失效。
      - name: 解析缓存 key
        id: cachekey
        run: |
          set -eu
          src=$(printf '%s' "$PONWRT_REF" | cut -c1-12)
          cfg=$( { cat config/build.env config/pt1570-r10.config; \
                   find patches -type f -name '*.patch' -exec sha256sum {} +; } \
                 | sha256sum | cut -c1-12 )
          # 先拉取 ponwrt 才能读到 sources.lock.json, 所以 openwrt pin 在下一步补进 key;
          # 这里先给出 src+cfg 前缀, 缓存步骤在那之后。
          echo "src=$src" >> "$GITHUB_OUTPUT"
          echo "cfg=$cfg" >> "$GITHUB_OUTPUT"
          echo "cache 前缀: src=$src cfg=$cfg"

      - name: 释放磁盘空间并安装依赖
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/local/share/chromium /usr/share/swift /opt/alibaba /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          sudo apt-get clean
          # 4 核 runner 上并行 make 偶尔 OOM; 8G swap 兜底(不是加速, 是防编译被杀)。
          sudo swapoff -a 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile && sudo chmod 600 /swapfile
          sudo mkswap /swapfile && sudo swapon /swapfile
          sudo apt-get update
          sudo apt-get install -y build-essential busybox clang-18 llvm-18 lld-18 flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl device-tree-compiler u-boot-tools swig \
            libelf-dev python3-pyelftools python3-dev libfuse-dev pkgconf
          df -hT /; free -h

      - name: 拉取上游 PonWRT-TYFZA1
        run: |
          git init "$PONWRT_DIR"
          git -C "$PONWRT_DIR" remote add origin "$PONWRT_REPO"
          git -C "$PONWRT_DIR" fetch --depth 1 origin "$PONWRT_REF"
          git -C "$PONWRT_DIR" checkout -q FETCH_HEAD
          git -C "$PONWRT_DIR" log -1 --format='上游提交 %H %cI %s'

      - name: 打适配补丁
        run: |
          # 补丁按目标分目录, 两个目标都有一个共同的内核补丁:
          #   fit: 0001-spinand-xtx-g02c —— 让 6.18 认出 PT1570 的 XT26G02C (0b:12) flash
          #   oem: 0001-oem-uboot-image-layout(裸 LZMA 升级 + 卷 ID 按名) + 同一个 flash 补丁
          # 没有这个 flash 补丁, 内核起得来但 MTD/UBI/overlay/无线校准全部缺失。
          shopt -s nullglob
          for patch in patches/"$BOOT_TARGET"/*.patch; do
            echo "== $patch"
            git -C "$PONWRT_DIR" apply --verbose "$GITHUB_WORKSPACE/$patch"
          done
          # 确认 flash 补丁的两个二级文件都已就位(打补丁后必须存在)
          test -f "$PONWRT_DIR/port/overlay/target/linux/rtl9617c/patches-6.18/232-spinand-xtx-g02c.patch"
          grep -q 'XT26G02C' "$PONWRT_DIR/port/overlay/target/linux/rtl9617c/patches-6.18/232-spinand-xtx-g02c.patch"
          if [ "$BOOT_TARGET" = "oem" ]; then
            upgrade="$PONWRT_DIR/port/overlay/target/linux/rtl9617c/base-files/lib/upgrade"
            for script in "$upgrade/platform.sh" "$upgrade/tyfza1-storage.sh" \
                          "$PONWRT_DIR/port/packages/tyfza1-storage/files/tyfza1-migrate-storage"; do
              test -f "$script"
              sh -n "$script"
            done
            grep -q pt1570_oem_upgrade "$upgrade/platform.sh"
            # 卷 ID 必须按名解析, 不允许再出现上游的 4/7 假设
            grep -q 'vol_id' "$PONWRT_DIR/port/packages/tyfza1-storage/files/tyfza1-migrate-storage"
            ! grep -q 'ubi_r0:${ubidev}_4' "$upgrade/tyfza1-storage.sh"
          fi

      - name: 获取锁定的 OpenWrt 源码
        working-directory: ponwrt
        run: sh port/scripts/prepare.sh sources/openwrt

      # 把 OpenWrt pin 固化成变量: restore/save 必须用一个 key。
      # 不能到 save 时再 hashFiles —— build.sh 的 sync-overlay.sh 会改源码树,
      # 那时 lock 文件的哈希可能已经变了, 会存到一个永远命不中的 key 上。
      - name: 固化缓存 pin
        id: owpin
        run: |
          set -eu
          pin=$(sha256sum "$PONWRT_DIR/port/sources.lock.json" | cut -c1-16)
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "OpenWrt 锁定 pin: $pin"

      - name: 准备 OMCI 交叉编译器
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-unknown-linux-musl
          echo "TYFZA1_CARGO=$(rustup which --toolchain 1.96.1 cargo)" >> "$GITHUB_ENV"

      # ---- 四层缓存(restore) ----
      # key = PonWRT 提交 + 我们的配置指纹 + 锁定的 OpenWrt pin; 任一变化自动失效。
      # 全部 continue-on-error: 命中不了退回全量编译, 不会让构建失败。
      # 注意: 原来的 key 引用了上游并不存在的 configs/feeds.conf, 导致 key 恒定;
      # 现在改用 sources.lock.json(compile 前已 clone), 源码变了 key 一定变。
      - name: Restore dl cache (源码包)
        id: dl_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ponwrt/sources/openwrt/dl
          key: pt1570-dl-${{ steps.cachekey.outputs.src }}-${{ steps.cachekey.outputs.cfg }}-${{ steps.owpin.outputs.pin }}
          restore-keys: pt1570-dl-${{ steps.cachekey.outputs.src }}-${{ steps.cachekey.outputs.cfg }}-

      - name: Restore toolchain & host tools cache
        id: tc_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ponwrt/sources/openwrt/staging_dir/host
            ponwrt/sources/openwrt/staging_dir/toolchain-*
            ponwrt/sources/openwrt/build_dir/toolchain-*
          key: pt1570-tc-${{ steps.cachekey.outputs.src }}-${{ steps.cachekey.outputs.cfg }}-${{ steps.owpin.outputs.pin }}
          restore-keys: pt1570-tc-${{ steps.cachekey.outputs.src }}-${{ steps.cachekey.outputs.cfg }}-

      - name: Restore ccache
        id: ccache_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ponwrt/sources/openwrt/.ccache
          key: pt1570-ccache-${{ steps.cachekey.outputs.src }}-${{ steps.cachekey.outputs.cfg }}-${{ steps.owpin.outputs.pin }}
          restore-keys: pt1570-ccache-${{ steps.cachekey.outputs.src }}-${{ steps.cachekey.outputs.cfg }}-

      # feeds 由 build.sh 内部的 prepare_luci_feeds.sh 生成; 缓存整目录让下次增量更新。
      - name: Restore feeds cache
        id: feeds_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ponwrt/sources/openwrt/feeds
            ponwrt/sources/openwrt/package/feeds
          key: pt1570-feeds-${{ steps.cachekey.outputs.src }}-${{ steps.owpin.outputs.pin }}
          restore-keys: pt1570-feeds-${{ steps.cachekey.outputs.src }}-

      - name: 获取运行时文件与签名密钥
        run: |
          mkdir -p artifacts/runtime-inputs artifacts/signing
          gh release download "$RUNTIME_RELEASE" --repo "${PONWRT_REPO#https://github.com/}" \
            --pattern "$RUNTIME_ASSET" --dir artifacts --clobber
          tar -xzf "artifacts/$RUNTIME_ASSET" -C artifacts/runtime-inputs
          umask 077
          if [ -n "${{ secrets.TYFZA1_FIT_SIGNING_KEY }}" ]; then
            printf '%s\n' "${{ secrets.TYFZA1_FIT_SIGNING_KEY }}" > artifacts/signing/dev.key
          else
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
              "$SIGNING_KEY_URL" --output artifacts/signing/dev.key
            echo "$SIGNING_KEY_SHA256  artifacts/signing/dev.key" | sha256sum -c -
          fi
          openssl req -new -x509 -key artifacts/signing/dev.key \
            -out artifacts/signing/dev.crt -subj /CN=PT1570-R10-CI -days 3650
          ls -l artifacts/runtime-inputs artifacts/signing
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 组装 .config
        run: |
          # 以上游自带的最小启动配置为底, 追加本机型的覆盖片段。
          cat ponwrt/port/configs/tyfza1-boot.config > artifacts/pt1570-r10.config
          echo >> artifacts/pt1570-r10.config
          cat config/pt1570-r10.config >> artifacts/pt1570-r10.config
          grep -c . artifacts/pt1570-r10.config

      - name: 编译 OpenWrt + 原生 PE 固件
        shell: bash
        working-directory: ponwrt
        env:
          TYFZA1_RUNTIME_INPUTS: ${{ github.workspace }}/artifacts/runtime-inputs
          TYFZA1_SIGNING_KEYS: ${{ github.workspace }}/artifacts/signing
          TYFZA1_CONFIG: ${{ github.workspace }}/artifacts/pt1570-r10.config
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          sh port/scripts/build.sh sources/openwrt "$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/artifacts/build.log"

      # ---- 四层缓存(save): 只在编译成功且该层未命中时上传, 避免覆盖已有缓存 ----
      # cache 同一 key 不可覆盖, 命中过说明内容已经是最新的, 不必再压一遍。
      - name: Save dl cache
        if: success() && steps.dl_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ponwrt/sources/openwrt/dl
          key: pt1570-dl-${{ steps.cachekey.outputs.src }}-${{ steps.cachekey.outputs.cfg }}-${{ steps.owpin.outputs.pin }}

      - name: Save toolchain & host tools cache
        if: success() && steps.tc_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ponwrt/sources/openwrt/staging_dir/host
            ponwrt/sources/openwrt/staging_dir/toolchain-*
            ponwrt/sources/openwrt/build_dir/toolchain-*
          key: pt1570-tc-${{ steps.cachekey.outputs.src }}-${{ steps.cachekey.outputs.cfg }}-${{ steps.owpin.outputs.pin }}

      - name: Save ccache
        if: success() && steps.ccache_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ponwrt/sources/openwrt/.ccache
          key: pt1570-ccache-${{ steps.cachekey.outputs.src }}-${{ steps.cachekey.outputs.cfg }}-${{ steps.owpin.outputs.pin }}

      - name: Save feeds cache
        if: success() && steps.feeds_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            ponwrt/sources/openwrt/feeds
            ponwrt/sources/openwrt/package/feeds
          key: pt1570-feeds-${{ steps.cachekey.outputs.src }}-${{ steps.owpin.outputs.pin }}

      - name: 打包刷机包
        run: |
          if [ "$BOOT_TARGET" = "fit" ]; then
            CONTRACT=uboot/contract-uboot2026.json
          else
            CONTRACT=uboot/contract.json
          fi
          python3 tools/make_bundle.py \
            --target "$BOOT_TARGET" \
            --tree "$OPENWRT_DIR" \
            --port "$PONWRT_DIR" \
            --out "artifacts/pt1570-r10-${FIRMWARE_VERSION}" \
            --contract "$CONTRACT" \
            --version "$FIRMWARE_VERSION" \
            --variant "$VARIANT" \
            --ponwrt-ref "$PONWRT_REF"

      - name: 按 U-Boot 契约校验
        run: |
          BUNDLE="artifacts/pt1570-r10-${FIRMWARE_VERSION}"
          if [ "$BOOT_TARGET" = "fit" ]; then
            python3 tools/verify_fit.py "$BUNDLE" \
              --contract uboot/contract-uboot2026.json \
              | tee artifacts/verify.log
            {
              echo "### 契约校验（U-Boot 2026.07 / uImage.FIT）"
              echo '```'
              cat artifacts/verify.log
              echo '```'
              echo
              echo "- FIT: $(stat -c%s "$BUNDLE/sysupgrade.itb") 字节"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            python3 tools/verify_bundle.py "$BUNDLE" \
              --contract uboot/contract.json --strict-raw \
              | tee artifacts/verify.log
            {
              echo "### 契约校验（原厂 U-Boot 2020.01）"
              echo '```'
              cat artifacts/verify.log
              echo '```'
              echo
              echo "- 内核 Image.lzma: $(stat -c%s "$BUNDLE/Image.lzma") 字节"
              echo "- 设备树 dtb.img: $(stat -c%s "$BUNDLE/dtb.img") 字节"
              echo "- 根文件系统 rootfs: $(stat -c%s "$BUNDLE/rootfs") 字节"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pt1570-r10-${{ env.FIRMWARE_VERSION }}
          path: |
            artifacts/pt1570-r10-${{ env.FIRMWARE_VERSION }}/
            artifacts/verify.log
          retention-days: 30
          if-no-files-found: warn

      - name: 发布 Release
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          BUNDLE="artifacts/pt1570-r10-${FIRMWARE_VERSION}"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "PT1570-R10 $FIRMWARE_VERSION" --draft \
              --notes "云编译产物。boot_target=fit 时是 U-Boot 2026.07 的 uImage.FIT 包；boot_target=oem 时是原厂 2020.01 的 Image.lzma/dtb.img/rootfs 三件套。刷机步骤见包内 flash-cmds.txt。"
          fi
          (cd "$BUNDLE" && zip -q -r "../pt1570-r10-${FIRMWARE_VERSION}.zip" .)
          gh release upload "$TAG" \
            "artifacts/pt1570-r10-${FIRMWARE_VERSION}.zip" \
            "artifacts/verify.log" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
